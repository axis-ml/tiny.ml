name: Docs

# Builds the odoc API docs and publishes them to GitHub Pages.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.4"

      - uses: actions/cache@v4
        with:
          path: _opam
          key: opam-docs-${{ runner.os }}-${{ hashFiles('*.opam', '.github/workflows/docs.yml') }}

      - run: opam install . --deps-only --with-doc

      - run: opam exec -- dune build @doc

      # The site root sends visitors straight to the package page.
      - run: |
          cp -rL _build/default/_doc/_html site
          chmod -R u+w site
          echo '<meta http-equiv="refresh" content="0; url=tiny_ml/">' > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
